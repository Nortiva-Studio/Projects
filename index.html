<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal - Nortiva </title>
  <meta name="description" content="Acompanhe lançamentos, melhorias, correções de bugs e novidades dos produtos da Nortiva.">

  <!-- Fonts: Space Grotesk (display), Inter (body), JetBrains Mono (data/versões) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" href="assets/images/favicon.png" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- ============================================================ -->
  <!-- HERO                                                          -->
  <!-- ============================================================ -->
  <section class="hero">
    <div class="hero-bg" aria-hidden="true">
      <div class="hero-grid"></div>
      <div class="hero-glow"></div>
    </div>


    <div class="hero-content">
      <span class="badge badge--eyebrow">Projetos</span>
      <h1 class="hero-title">Todas os projetos da <span class="hero-title-accent">Nortiva</span></h1>
      <p class="hero-subtitle">
        Acompanhe lançamentos, melhorias, correções de bugs e novidades dos nossos produtos.
      </p>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- TIMELINE / JOURNAL                                            -->
  <!-- ============================================================ -->
  <main class="journal">
    <div class="journal-container">

      <div class="rail" aria-hidden="true">
        <div class="rail-track"></div>
      </div>

      <div class="entries">

        <!-- ========================================================= -->
        <!-- ENTRY — v1.3.0                                             -->
        <!-- ========================================================= -->
        <article class="entry reveal" data-category="cloud" id="v1.0.0">
          <div class="entry-node" aria-hidden="true"><span class="entry-node-dot"></span></div>

          <div class="entry-card">
            <header class="entry-head">
              <span class="cat-badge cat-badge--cloud">
                <span class="cat-dot"></span>Cloud
              </span>
              <span class="entry-version"></span>
              <time class="entry-date" datetime="2026-07-25">25 jul 2026</time>
            </header>

            <h2 class="entry-title">Algo grande está sendo construído. 👀☁️</h2>

             <div class="entry-image">
              <img src="" alt="https://portalnortiva.vercel.app/assets/images/cloud.jpg" loading="lazy">
            </div>

            <footer class="entry-footer">
              <span class="entry-author">Equipe Nortiva</span>
            </footer>
          </div>
        </article>
        
        <div class="entries-end">
          <span class="entries-end-dot" aria-hidden="true"></span>
          <p>Você chegou ao início dos projetos.</p>
        </div>

      </div>
    </div>
  </main>


  
  <!-- ============================================================ -->
  <!-- FOOTER                                                        -->
  <!-- ============================================================ -->

<footer class="footer-simple">

  © 2026 NORTIVA • 
  <a href="https://github.com/nortiva"  target="_blank">GitHub</a> 
</footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
